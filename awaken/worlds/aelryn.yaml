event_rules:
  ITEM_STOLEN:
    memory_template: The player stole {target_name} from {faction_name}.
    interpretation_guidance: Consider the faction's view of theft, the object's significance, and whether the NPC heard this directly or through others.
  PLAYER_HELPED:
    memory_template: The player helped {faction_name} during a crisis.
    interpretation_guidance: Consider motive, risk, existing distrust, and whether help repaired an earlier harm.
  PLAYER_ATTACKED:
    memory_template: The player attacked {target_name}.
    interpretation_guidance: Consider fear, retaliation, respect for strength, and loyalty to the target.
  WARD_REINFORCED:
    memory_template: The player reinforced {entity_key}.
    interpretation_guidance: Treat this as disciplined protection of Aelryn and strong evidence of reliability, especially to guards and Temple loyalists.
  WARD_SABOTAGED:
    memory_template: The player sabotaged {entity_key}.
    interpretation_guidance: Treat this as a grave threat to public safety and proof of hostility toward the Temple's protective duty.
  GATE_OPENED:
    memory_template: The player opened {entity_key}.
    interpretation_guidance: Consider whether this exposed Vael, endangered civilians, or deliberately undermined the Temple's wards.
  RITUAL_COMPLETED:
    memory_template: The player completed {ritual_key}.
    interpretation_guidance: Treat this as respect for Temple practice, discipline under pressure, and direct service to Aelryn's wards.
  RITUAL_DEFILED:
    memory_template: The player defiled {ritual_key}.
    interpretation_guidance: Treat this as sacrilege, contempt for Temple authority, and a direct threat to the ward system.
  EVIDENCE_DELIVERED:
    memory_template: The player delivered evidence about {entity_key}.
    interpretation_guidance: Consider who received the evidence. The Mages Guild respects disclosure to Elara; the Temple distrusts exposing internal failures.
  EVIDENCE_DESTROYED:
    memory_template: The player destroyed evidence about {entity_key}.
    interpretation_guidance: Consider whether this protects secrecy, obstructs truth, or proves the player can be bought or frightened.
  PLAYER_SPOKE_CUSTOM:
    memory_template: The player said "{message}" to {target_name}.
    interpretation_guidance: Interpret the player's exact words as direct speech. React to insults, threats, promises, confessions, apologies, or useful information, but do not treat normal authored dialogue tracks as events.
  QUEST_COMPLETED:
    memory_template: The player completed {target_name}.
    interpretation_guidance: Consider whether this fulfilled a promise and who benefited.
